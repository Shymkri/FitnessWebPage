<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
<style>
    .fitmom-wrapper, .fitmom-wrapper * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

        :root {
            /* Exact Color Palette from Design */
            --cyan-primary: #06B6D4;
            --cyan-light: #67E8F9;
            --amber-primary: #F59E0B;
            --amber-deep: #D97706;
            --lavender-bg: #F3F4FF;
            --text-dark: #1F2937;
            --white: #FFFFFF;
        }

        .fitmom-wrapper {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #111827 0%, #0F172A 100%);
            color: #F9FAFB;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="%23F59E0B" opacity="0.3"/><circle cx="12" cy="12" r="4" fill="%23F59E0B"/></svg>') 12 12, auto;
        }

        /* Animated Background Pattern */
        .fitmom-wrapper::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.04;
            z-index: 1;
            pointer-events: none;
            background-image: 
                radial-gradient(circle, #06B6D4 2px, transparent 2px),
                radial-gradient(circle, #F59E0B 2px, transparent 2px);
            background-size: 80px 80px, 60px 60px;
            background-position: 0 0, 40px 40px;
            animation: patternMove 60s linear infinite;
        }

        @keyframes patternMove {
            0% {
                background-position: 0 0, 40px 40px;
            }
            100% {
                background-position: 80px 80px, 120px 120px;
            }
        }

        /* Main Container */
        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;  
            position: relative;
        }

        /* Decorative Floral Elements */
        .floral-decoration {
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }

        .floral-left {
            bottom: 20%;
            left: 5%;
            width: 120px;
            height: 200px;
            opacity: 0.6;
            animation: floatLeft 6s ease-in-out infinite;
        }

        .floral-right {
            top: 15%;
            right: 8%;
            width: 120px;
            height: 200px;
            opacity: 0.6;
            animation: floatRight 6s ease-in-out infinite 1s;
        }

        @keyframes floatLeft {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(-8deg); }
        }

        @keyframes floatRight {
            0%, 100% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-15px) rotate(8deg); }
        }

        /* Content Card with Glassmorphism */
        .content-card {
            max-width: 680px;
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(30px);
            border-radius: 40px;
            padding: 40px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
            animation: cardAppear 0.8s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Question Section */
        .question-section {
            text-align: center;
            margin-bottom: 48px;
        }

        .question-title {
            font-family: 'Playfair Display', serif;
            font-size: 44px;
            font-weight: 900;
            line-height: 1.2;
            color: #F9FAFB;
            margin-bottom: 24px;
            animation: slideDown 0.6s ease-out 0.2s backwards;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 24px 0;
            animation: fadeIn 0.6s ease-out 0.4s backwards;
        }

        .divider-line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #06B6D4, transparent);
        }

        .divider-icon {
            color: #06B6D4;
            font-size: 18px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .question-subtitle {
            font-size: 16px;
            color: #9CA3AF;
            font-weight: 500;
            animation: fadeIn 0.6s ease-out 0.6s backwards;
        }

        /* Cards Container */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        /* Age Card */
        .age-card {
            position: relative;
            padding: 40px 28px;
            border-radius: 28px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            animation: cardSlideUp 0.6s ease-out backwards, cardPulse 3s ease-in-out 2s infinite;
            border: 2px solid;
        }

        .age-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            opacity: 0;
            transition: opacity 0.4s ease;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: cardShimmer 3s linear infinite;
        }

        .age-card:hover::before {
            opacity: 1;
        }

        .age-card:hover {
            transform: translateY(-12px) scale(1.05);
            animation: cardSlideUp 0.6s ease-out backwards, cardPulse 3s ease-in-out 2s infinite;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="%2306B6D4" opacity="0.4"/><circle cx="20" cy="20" r="10" fill="%2306B6D4"/><path d="M15 20 L25 20 M22 17 L25 20 L22 23" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'), pointer;
        }

        @keyframes cardSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Automated Pulse Animation */
        @keyframes cardPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        /* Automated Shimmer Effect */
        @keyframes cardShimmer {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        /* Automated Glow Animation for Pink Card */
        @keyframes cyanGlow {
            0%, 100% {
                box-shadow: 0 8px 24px rgba(6, 182, 212, 0.2);
            }
            50% {
                box-shadow: 0 12px 40px rgba(6, 182, 212, 0.4), 0 0 30px rgba(6, 182, 212, 0.3);
            }
        }

        /* Automated Glow Animation for Purple Card */
        @keyframes amberGlow {
            0%, 100% {
                box-shadow: 0 8px 24px rgba(245, 158, 11, 0.2);
            }
            50% {
                box-shadow: 0 12px 40px rgba(245, 158, 11, 0.4), 0 0 30px rgba(245, 158, 11, 0.3);
            }
        }

        /* Icon Circle Pulse Animation */
        @keyframes iconPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* Pink Card (30-45) */
        .card-cyan {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.05) 0%, rgba(6, 182, 212, 0.15) 100%);
            border-color: rgba(6, 182, 212, 0.4);
            border-width: 2px;
            animation-delay: 0.8s;
            animation: cardSlideUp 0.6s ease-out 0.8s backwards, cardPulse 3s ease-in-out 2.8s infinite, cyanGlow 4s ease-in-out 3s infinite;
        }

        .card-cyan::before {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(103, 232, 249, 0.2));
        }

        .card-cyan:hover {
            box-shadow: 0 20px 60px rgba(6, 182, 212, 0.4), 0 0 40px rgba(6, 182, 212, 0.3);
            animation: cardSlideUp 0.6s ease-out 0.8s backwards, cardPulse 3s ease-in-out 2.8s infinite, cyanGlow 4s ease-in-out 3s infinite;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="%2306B6D4" opacity="0.3"/><circle cx="24" cy="24" r="14" fill="%2306B6D4"/><path d="M16 24 L32 24 M28 20 L32 24 L28 28" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') 24 24, pointer;
            border-color: rgba(6, 182, 212, 0.6);
        }

        /* Purple Card (45-65) */
        .card-amber {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.05) 0%, rgba(245, 158, 11, 0.15) 100%);
            border-color: rgba(245, 158, 11, 0.4);
            border-width: 2px;
            animation-delay: 1s;
            animation: cardSlideUp 0.6s ease-out 1s backwards, cardPulse 3s ease-in-out 3s infinite, amberGlow 4s ease-in-out 3.5s infinite;
        }

        .card-amber::before {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(217, 119, 6, 0.2));
        }

        .card-amber:hover {
            box-shadow: 0 20px 60px rgba(245, 158, 11, 0.4), 0 0 40px rgba(245, 158, 11, 0.3);
            animation: cardSlideUp 0.6s ease-out 1s backwards, cardPulse 3s ease-in-out 3s infinite, amberGlow 4s ease-in-out 3.5s infinite;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="%23F59E0B" opacity="0.3"/><circle cx="24" cy="24" r="14" fill="%23F59E0B"/><path d="M16 24 L32 24 M28 20 L32 24 L28 28" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>') 24 24, pointer;
            border-color: rgba(245, 158, 11, 0.6);
        }

        /* Icon Circle */
        .icon-circle {
            width: 100px;
            height: 100px;
            margin: 0 auto 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            animation: iconPulse 2.5s ease-in-out 3s infinite;
        }

        .age-card:hover .icon-circle {
            transform: scale(1.1);
            animation: iconPulse 2.5s ease-in-out 3s infinite;
        }

        .icon-circle-cyan {
            background: linear-gradient(135deg, #06B6D4 0%, #67E8F9 100%);
        }

        .icon-circle-amber {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        }

        .icon-svg {
            width: 48px;
            height: 48px;
        }

        /* Age Number */
        .age-number {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            font-weight: 900;
            margin-bottom: 16px;
            line-height: 1;
        }

        .card-cyan .age-number {
            color: #06B6D4;
        }

        .card-amber .age-number {
            color: #F59E0B;
        }

        /* Age Description */
        .age-description {
            font-size: 15px;
            color: #9CA3AF;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        /* Arrow Button */
        .arrow-button {
            width: 56px;
            height: 56px;
            margin: 0 auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            animation: arrowBounce 2s ease-in-out 4s infinite;
        }

        @keyframes arrowBounce {
            0%, 100% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(5px);
            }
        }

        .card-cyan .arrow-button {
            background: linear-gradient(135deg, #06B6D4, #67E8F9);
        }

        .card-amber .arrow-button {
            background: linear-gradient(135deg, #F59E0B, #D97706);
        }

        .age-card:hover .arrow-button {
            transform: translateX(8px) scale(1.15);
            animation: arrowBounceHover 1s ease-in-out infinite;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        }

        @keyframes arrowBounceHover {
            0%, 100% {
                transform: translateX(8px) scale(1.15);
            }
            50% {
                transform: translateX(12px) scale(1.2);
            }
        }

        .arrow-icon {
            color: white;
            font-size: 24px;
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        .age-card:hover .arrow-icon {
            animation: arrowPulse 0.6s ease-in-out infinite;
        }

        @keyframes arrowPulse {
            0%, 100% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(3px);
            }
        }

        /* Trust Badge */
        .trust-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px 24px;
            animation: fadeIn 0.6s ease-out 1.2s backwards;
        }

        .trust-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #06B6D4, #F59E0B);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .trust-icon {
            width: 24px;
            height: 24px;
            color: white;
        }

        .trust-text {
            text-align: left;
        }

        .trust-title {
            font-size: 15px;
            font-weight: 700;
            color: #F9FAFB;
            margin-bottom: 4px;
        }

        .trust-subtitle {
            font-size: 13px;
            color: #9CA3AF;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .content-card {
                padding: 48px 16px;
            }

            .question-title {
                font-size: 36px;
            }

            .cards-container {
                gap: 16px;
            }

            .age-card {
                padding: 32px 16px;
            }

            .age-number {
                font-size: 36px;
            }

            .age-description {
                font-size: 13px;
                margin-bottom: 20px;
            }

            .icon-circle {
                width: 70px;
                height: 70px;
                margin-bottom: 20px;
            }

            .icon-svg {
                width: 36px;
                height: 36px;
            }

            .arrow-button {
                width: 48px;
                height: 48px;
            }

            .floral-left,
            .floral-right {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .main-container {
                padding: 20px 12px;
            }

            .content-card {
                padding: 32px 12px;
                border-radius: 24px;
            }

            .question-title {
                font-size: 28px;
                margin-bottom: 20px;
            }

            .cards-container {
                gap: 12px;
            }

            .age-card {
                padding: 24px 8px;
                border-radius: 20px;
            }

            .age-number {
                font-size: 26px;
                margin-bottom: 8px;
            }

            .age-description {
                font-size: 11px;
                margin-bottom: 16px;
                line-height: 1.3;
            }

            .icon-circle {
                width: 50px;
                height: 50px;
                margin-bottom: 16px;
            }

            .icon-svg {
                width: 26px;
                height: 26px;
            }

            .arrow-button {
                width: 36px;
                height: 36px;
            }

            .trust-badge {
                padding: 16px 12px;
                gap: 12px;
            }

            .trust-title {
                font-size: 13px;
            }

            .trust-subtitle {
                font-size: 11px;
            }
        }

        /* Loading State */
        .age-card.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        /* Accessibility */
        .age-card:focus-visible {
            outline: 3px solid #F59E0B;
            outline-offset: 4px;
        }
    </style>

<div class="fitmom-wrapper">

    <script>
        // Analytics Tracking
        function trackClick(ageGroup, program, url) {
            if (typeof gtag !== 'undefined') {
                gtag('event', 'age_group_selection', {
                    'event_category': 'User Selection',
                    'event_label': ageGroup,
                    'program_type': program,
                    'destination_url': url,
                    'timestamp': new Date().toISOString()
                });
            }

            console.log('Age Group Selected:', {
                ageGroup: ageGroup,
                program: program,
                url: url,
                timestamp: new Date().toISOString()
            });
        }

        // Haptic Feedback
        const cards = document.querySelectorAll('.age-card');
        cards.forEach(card => {
            card.addEventListener('touchstart', () => {
                if (navigator.vibrate) {
                    navigator.vibrate(10);
                }
            });

            card.addEventListener('click', function() {
                this.classList.add('loading');
            });
        });

        // Page Load Tracking
        window.addEventListener('load', () => {
            if (typeof gtag !== 'undefined') {
                gtag('event', 'page_view', {
                    'page_title': 'Age Selection - FitMom Project',
                    'page_location': window.location.href
                });
            }
        });

        // UTM Parameter Capture
        function captureUTMParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const utmParams = {
                utm_source: urlParams.get('utm_source'),
                utm_medium: urlParams.get('utm_medium'),
                utm_campaign: urlParams.get('utm_campaign')
            };

            if (Object.values(utmParams).some(val => val !== null)) {
                sessionStorage.setItem('utm_params', JSON.stringify(utmParams));
            }
        }

        captureUTMParams();
    </script>
</div>
